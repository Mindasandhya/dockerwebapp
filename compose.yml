version: '3.8'

services:
  application_image:
    image: vprofile-app
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    volumes:
      - myvolume1:/sandhya
    networks:
      - network1
    depends_on:
      - database_image

  database_image:
    image: vprofile-db
    ports:
      - "1112:3306"
    deploy:
      replicas: 3
    volumes:
      - myvolume2:/sandhyaSrinivas
    networks:
      - network1

volumes:
  myvolume1:
  myvolume2:

networks:
  network1:
    driver: overlay
